   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="576" y="45.910562" transform="rotate(-0 576 45.910562)">From a fresh checkout to an ESPnet RL environment</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506a80" x="576" y="74.46525" transform="rotate(-0 576 74.46525)">Keep the optional RL stack isolated; install the pinned source revisions before launch.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="220.284" y="132.726387" transform="rotate(-0 220.284 132.726387)">1. Host prerequisites</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(111.911695 159.137197)">Linux + compatible NVIDIA driver / CUDA</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(114.220875 172.88949)">Python + compiler + audio system tools</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="553.4424" y="132.726387" transform="rotate(-0 553.4424 132.726387)">2. Check out source revisions</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(479.732947 158.94773)">ESPnet integration commit</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(456.349353 173.354895)">Pinned Miles + ESPnet SGLang fork</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="909.1584" y="132.726387" transform="rotate(-0 909.1584 132.726387)">3. Create an isolated RL environment</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(789.724181 159.137197)">Use the optional installer and selected profile</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(794.47297 172.88949)">Keep supervised SpeechLM extras separate</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="315.72" y="275.041206" transform="rotate(-0 315.72 275.041206)">4. CPU verification before any GPU allocation</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(141.378469 310.655517)">Dependency, source revision and import checks; CPU regression</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(159.325875 324.800733)">CPU checks do not validate GPU kernels or model training</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="832.8096" y="275.091988" transform="rotate(-0 832.8096 275.091988)">5. Resolve model assets and prepare data</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(671.218819 310.655517)">Native checkpoint + tokenizer / codec / optional ASR assets</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(661.012819 324.800733)">wav.scp + text or QA labels → train + held-out JSONL manifests</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="315.72" y="439.730406" transform="rotate(-0 315.72 439.730406)">6A. Main entry: one GPU, collocate</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(161.915344 478.433517)">Select family YAML; validate configuration and manifests</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(149.766187 492.578733)">32 prompts × 8 candidates; start with the short public profile</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="832.8096" y="439.730406" transform="rotate(-0 832.8096 439.730406)">6B. Optional entry: two GPUs, async</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(689.525662 478.433517)">Validate configuration, manifests and Ray placement</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(676.584225 492.578733)">One learner GPU + one rollout GPU; staleness ≤ 1 update</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="576" y="590.379606" transform="rotate(-0 576 590.379606)">7. Inspect outputs and evaluate independently</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18324b" x="576" y="623.9105" transform="rotate(-0 576 623.9105)">Native weights + optimizer state + metrics  →  held-out WER / MMAU with an explicit sample denominator</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506a80" x="576" y="679.932531" transform="rotate(-0 576 679.932531)">Installation and CPU checks are separate from GPU acceptance. Consult the pinned setup guide and family limitations.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #506a80" x="576" y="705.204531" transform="rotate(-0 576 705.204531)">Main recipes: 1 GPU collocate or 2 GPU async; custom layouts use at most 4 GPUs.</text>
   </g>
  </g>
 </g>
