# New short-run template: 32 independent prompts x 8 candidates = 256.
# Five optimizer updates total; FP32, unchanged 1536-token cap.
# Public collocate maps to execution_mode=sync; disagg_async needs its driver.
# Resolve model/data/environment paths and freeze the data admission first.
family: bagpiper
train_config: conf/train.yaml
checkpoint: exp/sft/export/model.pt
manifest: data/rl/train32.jsonl
output_dir: exp/rl_disagg_async_32x8
rollout_backend: sglang
adapter_factory: espnet2.speechlm.model.speechlm.rl.bagpiper.policy:factory
exporter: espnet2.speechlm.model.speechlm.rl.bagpiper.integration:exporter
request_factory: espnet2.speechlm.model.speechlm.rl.bagpiper.integration:request_factory
sglang_generate_factory: espnet2.speechlm.model.speechlm.rl.bagpiper.rollout:generate
reward_function: espnet2.speechlm.model.speechlm.rl.bagpiper.rewards:qa_reward
device: cuda:0
reference_device: cpu
rollout_gpus: '2'
rollout_python: python
sglang_source: ../../../tools/sglang
sglang_engine_kwargs:
  attention_backend: torch_native
  context_length: 4096
adapter_options:
  reference_assets: exp/sft/hf_assets
  native_attention: sdpa
  codec_config_path: exp/sft/codec_config
  audio_config_path: exp/sft/audio_config
  audio_processor_path: exp/sft/audio_processor
  tokenizer_mode: hf
  score_chunk_size: 32
  activation_cpu_offload: true
dtype: float32
optimizer_device: cpu
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 1
learning_rate: 1.0e-06
kl_coef: 0.04
max_tokens: 1536
score_tolerance: 0.03
execution_mode: disagg_async
train_batch_size: 32
n_samples_per_prompt: 8
update_weights_interval: 1
max_weight_staleness: 1
async_off_policy_correction: icepop
tis_clip_low: 0.5
tis_clip: 2.0
eval_manifest: data/rl/heldout.jsonl
ppo_epochs: 1
distributed_strategy: native_allreduce
allreduce_chunk_bytes: 67108864
