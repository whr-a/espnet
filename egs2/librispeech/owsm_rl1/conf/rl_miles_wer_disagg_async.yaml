# New short-run template: 32 independent prompts x 8 candidates = 256.
# Five optimizer updates total; FP32, unchanged 1536-token cap.
# Public collocate maps to execution_mode=sync; disagg_async needs its driver.
# Resolve model/data/environment paths and freeze the data admission first.
family: owsm
model_version: v4
rollout_backend: sglang
adapter_factory: espnet2.s2t.rl.policy:build_policy
exporter: espnet2.s2t.rl.export:export_owsm
sglang_generate_factory: espnet2.s2t.rl.sglang_rollout:generate
reward_function: null
dtype: float32
train_encoder: true
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 1
ppo_epochs: 1
learning_rate: 1.0e-05
weight_decay: 0.0
max_grad_norm: 1.0
clip_ratio: 0.2
kl_coef: 0.01
kl_type: k3
normalize_advantage: true
loss_agg_mode: token-mean
max_tokens: 1536
temperature: 1.0
top_p: 1.0
top_k: -1
score_tolerance: 0.03
language: <eng>
task: <asr>
predict_timestamps: false
sglang_engine_kwargs:
  attention_backend: torch_native
  sampling_backend: pytorch
execution_mode: disagg_async
train_batch_size: 32
n_samples_per_prompt: 8
update_weights_interval: 1
max_weight_staleness: 1
async_off_policy_correction: icepop
tis_clip_low: 0.5
tis_clip: 2.0
eval_manifest: data/rl/heldout.jsonl
reference_device: cpu
