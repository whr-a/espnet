# Long-form ASR on two H100s: GPU 0 trains while GPU 1 runs the rollout
# engine. OWSM v4 base is 102M, so the reference policy, Adam state and
# scoring all stay on the GPU. It uses the devices of rl_miles_wer_2gpu_async with
# its own data and reward, and smaller microbatches (4, not 16), max_tokens
# (1024, not 1536) and concurrent requests (64, not 256). OWSM's prompt is its
# <lang>/<task>/<notimestamps> control symbols only, which is why this family
# gets the long-form task and not the instruction-following speaker tasks.
#
# OWSM's frontend takes a fixed 30-second window (preprocessor_conf.speech_length:
# 30 at fs 16000 in its training YAML), and espnet2/s2t/rl/policy.py's
# load_audio raises on longer audio instead of truncating it. A reference that
# fits the window is about 70 words, roughly 120 text tokens, so max_tokens
# 1024 leaves headroom. Prepare the manifest with the window, which the
# preparer checks for every item:
#   python -m espnet2.rl.tasks longform_wer --wav-scp ... --text ... \
#     --train-config /path/to/owsm/local_config.yaml \
#     --min-reference-words 50 --concatenate 2 --output data/rl/longform.jsonl
# The recipe README gives the measured LibriSpeech limits. True long-form RL
# needs a family without a fixed window (Bagpiper, OpusLM) or explicit
# segmentation.
family: owsm
model_version: v4
execution_mode: disagg_async
rollout_backend: sglang
adapter_factory: espnet2.s2t.rl.policy:build_policy
exporter: espnet2.s2t.rl.export:export_owsm
sglang_engine: espnet2.s2t.rl.sglang_rollout:OWSMEngine
reward_function: longform_wer
dtype: float32
train_encoder: true
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 4
ppo_epochs: 1
learning_rate: 1.0e-05
weight_decay: 0.0
max_grad_norm: 1.0
clip_ratio: 0.2
kl_coef: 0.01
kl_type: k3
normalize_advantage: true
loss_agg_mode: token-mean
max_tokens: 1024
temperature: 1.0
top_p: 1.0
top_k: -1
score_tolerance: 0.03
language: <eng>
task: <asr>
predict_timestamps: false
device: cuda:0
reference_device: cuda:0
optimizer_device: null
distributed_timeout_minutes: 4320
update_weights_interval: 1
max_weight_staleness: 1
tis_clip_low: 0.5
tis_clip: 2.0
train_gpus: '0'
rollout_gpus: '1'
rollout_mem_fraction: 0.6
sglang_engine_kwargs:
  attention_backend: torch_native
  sampling_backend: pytorch
  max_running_requests: 64
