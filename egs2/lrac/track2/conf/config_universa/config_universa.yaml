-   - dump/raw/overall_dev/wav.scp
    - audio
    - kaldi_ark
-   - dump/raw/overall_dev/metric.scp
    - metrics
    - metric
-   - dump/raw/overall_dev/ref_wav.scp
    - ref_audio
    - kaldi_ark
multi_task_dataset: false
allow_variable_data_keys: false
max_cache_size: 0.0
max_cache_fd: 32
allow_multi_rates: false
valid_max_cache_size: null
exclude_weight_decay: false
exclude_weight_decay_conf: {}
optim: adamw
optim_conf:
    lr: 0.001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 25000
metric2id: /work/nvme/bbjs/shi3/evaluation/espnet/egs2/universa_unite/uni_versa1/dump/raw/overall_base/metric2id
metric2type: /work/nvme/bbjs/shi3/evaluation/espnet/egs2/universa_unite/uni_versa1/dump/raw/overall_base/metric2type
metric_pad_value: -100
token_list: null
metric_token_info: /work/nvme/bbjs/shi3/evaluation/espnet/egs2/universa_unite/uni_versa1/data/token_list/metric_100_percentile_overall_base/tokens.json
metric_token_pad_value: 0
tokenize_numerical_metric: false
init: xavier_uniform
model_conf: {}
use_ref_audio: true
use_ref_text: false
use_preprocessor: true
token_type: bpe
bpemodel: null
non_linguistic_symbols: null
cleaner: null
g2p: null
sequential_metric: false
randomize_sequential_metric: false
frontend: s3prl
frontend_conf:
    frontend_conf:
        upstream: wavlm_large
    download_dir: ./hub
    multilayer_feature: true
universa: base_flex
universa_conf:
    embedding_dim: 256
    audio_encoder_type: transformer
    audio_encoder_params:
        num_blocks: 4
        attention_heads: 4
        linear_units: 1024
        dropout_rate: 0.1
        positional_dropout_rate: 0.1
        attention_dropout_rate: 0.1
        input_layer: conv2d
        normalize_before: true
        concat_after: false
        positionwise_layer_type: linear
        positionwise_conv_kernel_size: 1
        layer_drop_rate: 0.1
        qk_norm: false
        use_flash_attn: false
    cross_attention_type: multihead
    cross_attention_params:
        n_head: 4
        dropout_rate: 0.1
    pooling_type: mean
    projector_type: xvector
    multi_branch: true
required:
- output_dir
- metric2id
version: '202503'
distributed: false
