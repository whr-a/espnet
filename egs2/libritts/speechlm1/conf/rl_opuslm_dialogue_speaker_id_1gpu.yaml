# Closed-set speaker identification on one H100 80GB, collocated learner and
# rollout engine. Geometry and memory are the accepted Dialogue one-GPU
# profile's (1.87e9 parameters, 6.96 GiB per FP32 copy, CPU Adam); only the
# supervision and reward change. A speaker label is a handful of text tokens,
# so max_tokens drops from 256 to 64 and the engine can hold every candidate
# of an update: 44 x (1280 + 64) still fits the 59.5k-token KV pool.
#
# OpusLM's prepared prompt is a nine-stream token matrix, so the instruction
# ("choose exactly one of these speakers") is appended to the primary stream
# of an already prepared condition:
#   python -m espnet2.rl.tasks speaker_id --wav-scp ... --utt2spk ...
#     --speaker-choices 4 --output data/rl/speaker_id.jsonl    # text-prompt families
# or espnet2.rl.tasks.derive.derive_task_manifest(..., instruction_tokens=...)
# to reuse an audited OpusLM condition without re-encoding its audio.
family: opuslm_dialogue
execution_mode: sync
rollout_backend: sglang
train_config: /path/to/released/config.yaml
checkpoint: /path/to/released/model.pth
manifest: data/rl/speaker_id_train.jsonl
eval_manifest: data/rl/speaker_id_dev.jsonl
output_dir: exp/rl_opuslm_dialogue_speaker_id_1gpu
adapter_factory: espnet2.speechlm.rl.policy:factory
exporter: espnet2.speechlm.rl.integration:exporter
sglang_engine: espnet2.speechlm.rl.integration:OpusLMEngine
reward_function: speaker_id
sglang_source: /path/to/pinned/sglang
rollout_python: /path/to/optional_rl_env/bin/python
dtype: float32
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 8
ppo_epochs: 1
learning_rate: 1.0e-06
weight_decay: 0.0
max_grad_norm: 1.0
clip_ratio: 0.2
kl_coef: 0.01
kl_type: k3
normalize_advantage: true
loss_agg_mode: token-mean
max_tokens: 64
temperature: 1.0
top_p: 1.0
top_k: -1
score_tolerance: 0.03
device: cuda:0
reference_device: cuda:0
optimizer_device: cpu
train_gpus: '0'
rollout_gpus: '0'
rollout_mem_fraction: 0.45
adapter_options:
  reference_assets: /path/to/checkpoint/hf_assets
  native_attention: sdpa
  inference_semantics: native
  gradient_checkpointing: true
sglang_engine_kwargs:
  attention_backend: triton
  context_length: 1344
  max_running_requests: 44
