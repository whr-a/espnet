# Nine-stream codec generation on one H100 80GB, collocated learner and rollout
# engine. This is the only profile in this recipe whose rollout samples AUDIO:
# the engine submits the primary stream to SGLang, samples streams 1..nq-1
# itself inside OpusLMMultiStreamForConditionalGeneration, and reports every
# frame's activity, actions and log probabilities back through
# customized_info["espnet_opuslm"]. Every other profile here samples text.
#
# THREE PIECES MUST MATCH, AND THEY ARE ALL NAMED BELOW.
#   * multistream_exporter writes the same weights as `exporter` with only
#     `architectures` changed, so the engine loads the codec architecture
#     rather than the text bridge. The two never share a class name; a recipe
#     chooses between them by the exported config.json.
#   * OpusLMMultiStreamEngine needs max_running_requests x context_length to
#     fit the KV pool, because a retracted request would be recomputed from
#     primary ids alone, without its secondary streams. 44 x 1024 = 45,056
#     tokens fits the 59.5k-token pool this profile's memory fraction leaves.
#   * espnet2.speechlm.rl.multistream owns the ARDelay supports and the delay
#     ramp, so the engine masks exactly the support the learner then scores.
#
# TRAIN-INFERENCE CONSISTENCY, MEASURED. Two steps of this shape at
# prompts_per_step 2 x group_size 2 and max_tokens 64 read
# rollout/logprob_max_error 3.00e-03 and 2.91e-03 against the 0.03
# score_tolerance gate below -- a 10x margin -- with p99 2.66e-03 / 2.59e-03,
# actor/tis 0.99998 / 0.99994, tis_clipfrac 0.0 and reward/invalid_codec 0.0 on
# every candidate. An independent pure-PyTorch replay of the same layout reads
# 2.46e-03 at 48 frames and 2.85e-03 at 400, and the log probability at every
# pad position is exactly 0.0, not merely small: the delay ramp and the
# trailing flush are environment, not actions, and leaking them into the
# importance ratio would be a systematic bias.
#
# WHAT IS NOT VERIFIED. The sampled block decodes to a waveform with plausible
# energy, but nothing here measures whether it sounds like speech -- that needs
# a codec decoder and a frozen ASR, which codec_block_reward deliberately does
# not load. And a dialogue-DPO checkpoint treats plain TTS as out of
# distribution: in the reference replay stream 0 never emitted the closing
# marker within 400 frames, so expect reward/closed near 0 and reward/no_audio
# well above 0 until the policy is trained or the checkpoint is a TTS one.
# Read reward/decodable_frames, reward/closed and reward/no_audio together;
# the reward is shape-only by design.
#
# Prepare prompts with espnet2.speechlm.rl.integration:tts_prompt over the
# native text ids, and keep codec_metadata on every record -- the reward's
# validate_sources rejects a manifest without it before any GPU starts.
family: opuslm_dialogue
execution_mode: sync
rollout_backend: sglang
train_config: /path/to/released/config.yaml
checkpoint: /path/to/released/model.pth
manifest: data/rl/tts_text_audio_train.jsonl
eval_manifest: data/rl/tts_text_audio_dev.jsonl
output_dir: exp/rl_opuslm_dialogue_multistream_tts_1gpu
adapter_factory: espnet2.speechlm.rl.policy:factory
exporter: espnet2.speechlm.rl.integration:multistream_exporter
sglang_engine: espnet2.speechlm.rl.integration:OpusLMMultiStreamEngine
reward_function: espnet2.rl.task_rewards:codec_block_reward
sglang_source: /path/to/pinned/sglang
rollout_python: /path/to/optional_rl_env/bin/python
dtype: float32
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 1
ppo_epochs: 1
learning_rate: 1.0e-06
weight_decay: 0.0
max_grad_norm: 1.0
clip_ratio: 0.2
kl_coef: 0.01
kl_type: k3
normalize_advantage: true
loss_agg_mode: token-mean
max_tokens: 400
temperature: 1.0
top_p: 1.0
top_k: -1
score_tolerance: 0.03
device: cuda:0
reference_device: cpu
optimizer_device: cpu
train_gpus: '0'
rollout_gpus: '0'
rollout_mem_fraction: 0.40
adapter_options:
  reference_assets: /path/to/checkpoint/hf_assets
  native_attention: sdpa
  inference_semantics: native
  gradient_checkpointing: true
sglang_engine_kwargs:
  attention_backend: triton
  context_length: 1024
  max_running_requests: 44
