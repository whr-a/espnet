# Closed-set speaker identification on two H100 80GB: GPU 0 trains, GPU 1
# runs the engine. Geometry, precision and placement are the accepted two-GPU
# Plain ASR profile's; only the supervision and reward change. A speaker label
# is a few text tokens, so max_tokens drops to 64 and the engine holds
# 28 x (1280 + 64) = 37.6k KV tokens, under its ~40.6k-token pool.
family: opuslm
execution_mode: disagg_async
rollout_backend: sglang
train_config: /path/to/released/config.yaml
checkpoint: /path/to/released/model.pth
manifest: data/rl/speaker_id_train.jsonl
eval_manifest: data/rl/speaker_id_dev.jsonl
output_dir: exp/rl_opuslm_speaker_id_2gpu_async
adapter_factory: espnet2.speechlm.rl.policy:factory
exporter: espnet2.speechlm.rl.integration:exporter
sglang_engine: espnet2.speechlm.rl.integration:OpusLMEngine
reward_function: espnet2.rl.task_rewards:speaker_id_reward
sglang_source: /path/to/pinned/sglang
rollout_python: /path/to/optional_rl_env/bin/python
dtype: float32
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 4
ppo_epochs: 1
learning_rate: 1.0e-06
weight_decay: 0.0
max_grad_norm: 1.0
clip_ratio: 0.2
kl_coef: 0.01
kl_type: k3
normalize_advantage: true
loss_agg_mode: token-mean
max_tokens: 64
temperature: 1.0
top_p: 1.0
top_k: -1
score_tolerance: 0.03
device: cuda:0
reference_device: cpu
optimizer_device: cpu
distributed_timeout_minutes: 4320
update_weights_interval: 1
max_weight_staleness: 1
tis_clip_low: 0.5
tis_clip: 2.0
train_gpus: '0'
rollout_gpus: '1'
rollout_mem_fraction: 0.85
adapter_options:
  reference_assets: /path/to/checkpoint/hf_assets
  native_attention: sdpa
  inference_semantics: native
  gradient_checkpointing: true
sglang_engine_kwargs:
  attention_backend: triton
  context_length: 1344
  max_running_requests: 28
