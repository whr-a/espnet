# Long-form ASR on one H100 80GB, collocated. Dialogue is 1.87e9 parameters,
# 6.96 GiB per FP32 copy, with CPU Adam, as in the accepted one-GPU profile.
# Long-form changes both ends of the sequence budget: a concatenated
# eight-utterance LibriSpeech item is about 2,950 condition frames plus the
# instruction, and a 200-word reference needs roughly 400 text tokens.
#
# KV accounting (unchanged engine share 0.45 x 64.0 GiB = 28.8 = weights 6.96
# + KV pool 21.8 GiB; one token of KV is 384 KiB = 24 layers x 2 x 2048 x 4 B,
# so the pool holds 59.5k tokens): with context_length 4096,
# max_running_requests 14 needs 14 x 4096 = 57.3k tokens < 59.5k, so no
# request is ever retracted. Microbatch 1 with a 4,608-token budget keeps the
# learner's activation peak at the profile's measured level.
#
# Prepare the manifest with:
#   python -m espnet2.rl.task_data --task longform_wer --wav-scp ... --text ...
#     --min-reference-words 200 --concatenate 8 --output data/rl/longform.jsonl
family: opuslm_dialogue
execution_mode: sync
rollout_backend: sglang
train_config: /path/to/released/config.yaml
checkpoint: /path/to/released/model.pth
manifest: data/rl/longform_train.jsonl
eval_manifest: data/rl/longform_dev.jsonl
output_dir: exp/rl_opuslm_dialogue_longform_wer_1gpu
adapter_factory: espnet2.speechlm.rl.policy:factory
exporter: espnet2.speechlm.rl.integration:exporter
sglang_engine: espnet2.speechlm.rl.integration:OpusLMEngine
reward_function: longform_wer
sglang_source: /path/to/pinned/sglang
rollout_python: /path/to/optional_rl_env/bin/python
dtype: float32
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 1
ppo_epochs: 1
learning_rate: 1.0e-06
weight_decay: 0.0
max_grad_norm: 1.0
clip_ratio: 0.2
kl_coef: 0.01
kl_type: k3
normalize_advantage: true
loss_agg_mode: token-mean
max_tokens: 512
temperature: 1.0
top_p: 1.0
top_k: -1
score_tolerance: 0.03
device: cuda:0
reference_device: cuda:0
optimizer_device: cpu
train_gpus: '0'
rollout_gpus: '0'
rollout_mem_fraction: 0.45
adapter_options:
  reference_assets: /path/to/checkpoint/hf_assets
  native_attention: sdpa
  inference_semantics: native
  gradient_checkpointing: true
sglang_engine_kwargs:
  attention_backend: triton
  context_length: 4096
  max_running_requests: 14
micro_batch_tokens: 4608
