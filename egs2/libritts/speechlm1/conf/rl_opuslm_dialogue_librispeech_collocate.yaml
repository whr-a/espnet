# 32 independent prompts x 8 candidates; 4 train ranks + 4 rollout GPUs on one node.
family: opuslm_dialogue
train_config: /path/to/released/config.yaml
checkpoint: /path/to/released/model.pth
manifest: data/rl/train32.jsonl
output_dir: exp/rl_opuslm_dialogue_librispeech_collocate_32x8
adapter_factory: espnet2.speechlm.rl.policy:factory
exporter: espnet2.speechlm.rl.integration:exporter
sglang_engine: espnet2.speechlm.rl.integration:OpusLMEngine
reward_function: espnet2.speechlm.rl.integration:asr_wer_reward
rollout_backend: sglang
sglang_source: /path/to/pinned/sglang
rollout_python: /path/to/optional_rl_env/bin/python
train_gpus: '0,1,2,3'
rollout_gpus: 4,5,6,7
device: cuda:0
reference_device: cpu
optimizer_device: cpu
dtype: float32
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 1
ppo_epochs: 1
learning_rate: 1.0e-06
max_tokens: 1536
score_tolerance: 0.03
adapter_options:
  reference_assets: /path/to/checkpoint/hf_assets
  native_attention: sdpa
  inference_semantics: native
sglang_engine_kwargs:
  disable_cuda_graph: true
  disable_radix_cache: true
  skip_tokenizer_init: true
  attention_backend: triton
  # max_running_requests x context_length must fit the KV pool (checked at
  # startup): 56 x 2600 = 146k of about 160k FP32 tokens of 384 KiB beside
  # the 7 GiB of weights; prompts of up to 1062 frames.
  context_length: 2600
  max_running_requests: 56
execution_mode: sync
update_weights_interval: 1
max_weight_staleness: 1
tis_clip_low: 0.5
tis_clip: 2.0
eval_manifest: data/rl/heldout.jsonl
distributed_strategy: native_allreduce
allreduce_chunk_bytes: 67108864
