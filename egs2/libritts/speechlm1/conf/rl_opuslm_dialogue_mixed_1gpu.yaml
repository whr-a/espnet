# Several tasks in one update on one H100 80GB, collocated. Every record
# declares its own reward_task; mixed_task_reward scores each with that task's
# reward. Mixing scales is safe because GRPO normalizes inside a prompt group:
# espnet2/rl/trainer.py passes the per-prompt uid to
# compute_grpo_outcome_advantage, so two tasks never share a baseline.
#
# Geometry is the accepted Dialogue one-GPU profile's. max_tokens is the
# longest task's budget, so keep the mix to tasks of comparable response
# length, or raise it and lower max_running_requests to match the KV pool.
#
# The manifest is the concatenation of per-task manifests from
# espnet2.rl.task_data; reward_task is already written into every record.
family: opuslm_dialogue
execution_mode: sync
rollout_backend: sglang
train_config: /path/to/released/config.yaml
checkpoint: /path/to/released/model.pth
manifest: data/rl/mixed_train.jsonl
eval_manifest: data/rl/mixed_dev.jsonl
output_dir: exp/rl_opuslm_dialogue_mixed_1gpu
adapter_factory: espnet2.speechlm.rl.policy:factory
exporter: espnet2.speechlm.rl.integration:exporter
sglang_engine: espnet2.speechlm.rl.integration:OpusLMEngine
reward_function: espnet2.rl.task_rewards:mixed_task_reward
sglang_source: /path/to/pinned/sglang
rollout_python: /path/to/optional_rl_env/bin/python
dtype: float32
seed: 42
steps: 5
warmup_steps: 1
prompts_per_step: 32
group_size: 8
micro_batch_size: 8
ppo_epochs: 1
learning_rate: 1.0e-06
weight_decay: 0.0
max_grad_norm: 1.0
clip_ratio: 0.2
kl_coef: 0.01
kl_type: k3
normalize_advantage: true
loss_agg_mode: token-mean
max_tokens: 256
temperature: 1.0
top_p: 1.0
top_k: -1
score_tolerance: 0.03
device: cuda:0
reference_device: cuda:0
optimizer_device: cpu
train_gpus: '0'
rollout_gpus: '0'
rollout_mem_fraction: 0.45
adapter_options:
  reference_assets: /path/to/checkpoint/hf_assets
  native_attention: sdpa
  inference_semantics: native
  gradient_checkpointing: true
sglang_engine_kwargs:
  attention_backend: triton
  context_length: 1280
  max_running_requests: 44
